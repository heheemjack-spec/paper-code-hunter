plugins {
    id 'com.android.application'
}

android {
    namespace 'com.paper.codehunter'
    compileSdk 35

    defaultConfig {
        applicationId 'com.paper.codehunter'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            // Release build is currently unsigned; signing will be configured securely
            // with a guardian-managed keystore before public distribution.
            minifyEnabled false
        }
    }
}
