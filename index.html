const _rgb=s=>{const m=String(s).match(/[\d.]+/g)||[0,0,0,1];return{r:+m[0],g:+m[1],b:+m[2],a:m[3]===undefined?1:+m[3]}};
const _lum=c=>{const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(c.r)+.7152*f(c.g)+.0722*f(c.b)};
function fixInk(t){
 if(!t||!t.tagName||!/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||['checkbox','radio','color','button','range'].includes(t.type))return;
 const cs=getComputedStyle(t),fg=_rgb(cs.webkitTextFillColor||cs.color),bg=_rgb(cs.backgroundColor),dark=document.documentElement.dataset.theme==='dark';
 const bl=bg.a<.5?(dark?.02:1):_lum(bg),fl=_lum(fg),r=(Math.max(fl,bl)+.05)/(Math.min(fl,bl)+.05);
 if(fg.a<.9||r<4.5){const B=dark?'#2b2418':'#ffffff',F=dark?'#f3ecd8':'#1a1a1a';t.style.setProperty('background-color',B,'important');t.style.setProperty('color',F,'important');t.style.setProperty('-webkit-text-fill-color',F,'important')}
}

function mqttLen(n){const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d)}while(n>0);return o}
function mqttStr(s){const b=_enc.encode(s);return [b.length>>8,b.length&255,...b]}
function mqttPkt(h,body){return new Uint8Array([h,...mqttLen(body.length),...body])}
function netStop(){net.want=false;clearTimeout(net.rt);clearInterval(net.t1);clearInterval(net.t2);const w=net.ws;net.ws=null;net.ok=false;net.peers={};if(w){try{w.close()}catch(e){}}}
function netLeave(){netStop();net.room='';if(me&&U()){delete U().room;sv()}if(tab==='chat')render()}
async function netJoin(code){
 code=String(code||'').trim().toLowerCase();
 if(code.length<4)return toast('รหัสห้องต้องยาวอย่างน้อย 4 ตัวอักษร');
 netStop();
 const km=await crypto.subtle.importKey('raw',_enc.encode(code),'PBKDF2',false,['deriveKey']);
 net.key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:_enc.encode('pch-chat-v1'),iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
 net.topic='pch1/'+_hex(await crypto.subtle.digest('SHA-256',_enc.encode('topic:'+code))).slice(0,24);
 net.room=code;net.want=true;net.peers={};
 if(me&&U()){U().room=code;sv()}
 netConnect();if(tab==='chat')render();
}
function autoRoom(){if(!chatRoom&&me&&U()&&U().room&&!net.want)netJoin(U().room)}
function netConnect(){
 if(!net.want)return;
 const urls=window.__brokers||BROKERS,url=urls[net.bi%urls.length];
 let ws;try{ws=new WebSocket(url,'mqtt')}catch(e){return netRetry()}
 ws.binaryType='arraybuffer';net.ws=ws;net.buf=new Uint8Array(0);
 ws.onopen=()=>ws.send(mqttPkt(0x10,[...mqttStr('MQTT'),4,2,0,30,...mqttStr('pch'+net.id)]));
 ws.onmessage=e=>netData(ws,new Uint8Array(e.data));
 ws.onclose=()=>{if(net.ws!==ws)return;net.ok=false;clearInterval(net.t1);clearInterval(net.t2);if(tab==='chat')drawChatStatus();netRetry()};
 ws.onerror=()=>{};
}
function netRetry(){if(!net.want)return;net.bi++;clearTimeout(net.rt);net.rt=setTimeout(netConnect,3000)}
function netData(ws,u){
 const b=new Uint8Array(net.buf.length+u.length);b.set(net.buf);b.set(u,net.buf.length);net.buf=b;
 while(net.buf.length>=2){
  let i=1,mul=1,len=0,d;
  do{if(i>=net.buf.length)return;d=net.buf[i++];len+=(d&127)*mul;mul*=128}while(d&128);
  if(net.buf.length<i+len)return;
  const type=net.buf[0]>>4,body=net.buf.slice(i,i+len);net.buf=net.buf.slice(i+len);
  if(type===2){if(body[1]===0)ws.send(mqttPkt(0x82,[0,1,...mqttStr(net.topic),0]));else ws.close()}
  else if(type===9){net.ok=true;if(tab==='chat'){drawChatStatus();drawOnline()}clearInterval(net.t1);clearInterval(net.t2);net.t1=setInterval(()=>{if(ws.readyState===1)ws.send(new Uint8Array([0xC0,0]))},20000);netHello();net.t2=setInterval(netHello,15000)}
  else if(type===3){const tl=(body[0]<<8)|body[1];netMsg(body.slice(2+tl))}
 }
}
async function netSendObj(o){
 if(!net.ok||!net.key||!net.ws||net.ws.readyState!==1)return false;
 const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},net.key,_enc.encode(JSON.stringify(o))));
 const pl=new Uint8Array(12+ct.length);pl.set(iv);pl.set(ct,12);
 net.ws.send(mqttPkt(0x30,[...mqttStr(net.topic),...pl]));return true;
}
async function netMsg(pl){
 try{
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:pl.slice(0,12)},net.key,pl.slice(12)),o=JSON.parse(_dec.decode(pt));
  if(o.k==='h'){net.peers[o.id]={n:String(o.n).slice(0,14),ts:Date.now()};if(tab==='chat')drawOnline()}
  else if(o.k==='m'&&typeof o.t==='string')onChatMsg({data:{n:String(o.n),av:o.av,t:o.t},isMe:o.id===net.id});
 }catch(e){}
}

 <button onclick="saveSelf()" class="btn w-full bg-purple-700 text-white py-2.5 mt-4">💾 บันทึก</button>`;
 else if(ct==='cats')h=catsPanel();
 else h=`<b>🎁 โค้ดทั้งหมด (${Object.keys(db.codes).length})</b><div class="mt-1 space-y-1">${Object.entries(db.codes).map(([c,d])=>`<div class="flex items-center justify-between bg-p1 rounded-lg px-2 py-1"><span class="font-mono text-xs"><b>${esc(c)}</b>${d.mini?' 🎮':''}${expT(d)} ${d.trap?`💀 กับดัก -${d.coins!==undefined?d.coins:50}🪙 -${d.keys!==undefined?d.keys:1}🔑`:`🪙${d.coins||0} 🔑${d.keys||0}${d.certs?` 🎫${d.certs}`:''}`}</span><span class="flex flex-wrap justify-end items-center gap-2"><select onchange="setCodeExp('${esc(c)}',this.value)" class="text-xs px-1 py-0.5 rounded border border-p3"><option value="">⏳ ตั้งอายุ</option><option value="none">ไม่หมดอายุ</option><option value="h1">หมดใน 1 ชม.</option><option value="h6">หมดใน 6 ชม.</option><option value="d1">หมดใน 1 วัน</option><option value="d7">หมดใน 7 วัน</option></select><select onchange="setCodeCat('${esc(c)}',this.value)" class="text-xs px-1 py-0.5 rounded border border-p3"><option value="">หมวด: ไม่มี</option>${(db.cats||[]).map(k=>`<option value="${esc(k)}" ${d.cat===k?'selected':''}>${esc(k)}</option>`).join('')}</select><button onclick="delCode('${esc(c)}')" class="text-vred text-xs">🗑️ ลบ</button></span></div>`).join('')||'<i class="text-xs text-gray-500">ไม่มีโค้ด</i>'}</div>
 <b class="block mt-4">📰 ข่าวทั้งหมด (${db.news.length})</b><div class="mt-1 space-y-1">${db.news.map(n=>`<div class="flex items-center justify-between bg-p1 rounded-lg px-2 py-1"><span class="text-xs">${TY[n.type][0]} ${esc(n.title)}</span><button onclick="delNews(${n.id})" class="text-vred text-xs">🗑️ ลบ</button></div>`).join('')||'<i class="text-xs text-gray-500">ไม่มีข่าว</i>'}</div>`;
 $('ct-body').innerHTML=h;
 if(ct==='code')updateRewardChoices();
 if(ct==='list'&&cloudUid)loadCreatorCodes();
}
const rewardCatalog={
 avatar:AV.map(x=>[x[0],x[1]+' '+x[1]]),
 frame:FR.filter(x=>x[0]!=='none').map(x=>[x[0],x[1]]),
 title:TT.map(x=>[x[0],x[0]]),
 card:CARDS.map(x=>[x[0],x[1]+' '+x[2]])
};
function updateRewardChoices(){
 const t=$('k-reward-type'),v=$('k-reward-value');if(!t||!v)return;
 const list=rewardCatalog[t.value]||[];
 v.innerHTML='<option value="">เลือกรางวัล</option>'+list.map(x=>'<option value="'+esc(x[0])+'">'+esc(x[1])+'</option>').join('');
 v.disabled=!list.length;
}
async function loadCreatorCodes(){
 const body=$('ct-body');if(!body||ct!=='list'||!cloudUid)return;
 body.innerHTML='<p class="text-xs text-gray-500">กำลังโหลดโค้ดจากเซิร์ฟเวอร์...</p>';
 const {data,error}=await sb.rpc('admin_list_redeem_codes');
 if(error)return body.innerHTML='<p class="text-vred text-xs">โหลดรายการไม่สำเร็จ: '+esc(error.message)+'</p>';
 if(!Array.isArray(data))return body.innerHTML='<p class="text-vred text-xs">'+esc(data&&data.message||'ไม่มีสิทธิ์ดูรายการ')+'</p>';
 body.innerHTML='<b>🎁 โค้ดทั้งหมด ('+data.length+')</b><p class="text-xs text-gray-500 mb-2">สิทธิ์กู้สูงสุดต่อโค้ดไม่เกิน 5,555 ครั้ง</p><div class="space-y-2">'+data.map(d=>'<div class="card"><div class="flex items-start justify-between gap-2"><div class="min-w-0"><b class="font-mono">'+esc(d.code)+'</b><div class="text-xs mt-1">🪙'+d.coins+' 🔑'+d.keys+' 🎫'+d.certs+(d.reward_type&&d.reward_type!=='none'?' · '+esc(d.reward_type)+':'+esc(d.reward_value)+' ×'+d.reward_qty:'')+'</div><div class="text-xs text-gray-500">ใช้แล้ว '+d.redeemed_count+'/'+d.max_redemptions+' · '+(d.active?'เปิดใช้งาน':'ปิดใช้งาน')+(d.expires_at?' · หมดอายุ '+new Date(d.expires_at).toLocaleString('th-TH'):'')+'</div></div><div class="flex flex-col gap-1 shrink-0"><button class="btn '+(d.active?'bg-amber-100':'bg-green-100')+'" onclick="setCodeActive(\''+esc(d.code)+'\','+(!d.active)+')">'+(d.active?'ปิดโค้ด':'เปิดโค้ด')+'</button><button class="btn bg-red-100 text-red-700" onclick="delCode(\''+esc(d.code)+'\')">ลบ</button></div></div></div>').join('')+'</div>';
}
async function setCodeActive(c,on){
 if(!isAdm())return;
 const {data,error}=await sb.rpc('admin_set_redeem_code_active',{p_code:c,p_active:on});
 if(error)return toast(error.message);
 if(!data||data.success!==true)return toast(data&&data.message||'เปลี่ยนสถานะไม่สำเร็จ');
 toast(on?'เปิดโค้ดแล้ว':'ปิดโค้ดแล้ว');loadCreatorCodes();
}
async function postNews(){
 if(!isAdm())return;const ti=$('n-title').value.trim(),bo=$('n-body').value.trim();
 if(!ti||!bo)return toast('กรอกหัวข้อและเนื้อหาให้ครบ');
 if(cloudUid){
  const {data,error}=await sb.from('news').insert({title:ti,content:bo,published:true}).select('id,title,content,published,created_at').single();
  if(error)return toast('โพสต์ข่าวไม่สำเร็จ: '+error.message);
  db.news.unshift({id:data.id,type:'hint',title:data.title,body:data.content,comments:[]});
 }else db.news.push({id:Date.now(),type:$('n-type').value,title:ti,body:bo,comments:[],closed:$('n-closed').checked});
 toast('📢 โพสต์ข่าวแล้ว');render();drawCreator();
}
async function makeCode(){
 if(!isAdm())return;const c=$('k-code').value.trim().toUpperCase().replace(/[\s'"\\<>&`$]/g,'');
 if(!/^[A-Z0-9_-]{3,32}$/.test(c))return toast('ใช้ A-Z, 0-9, _ หรือ - ความยาว 3-32 ตัว');
 const trap=$('k-kind').value==='trap',coins=+$('k-coins').value||0,keys=+$('k-keys').value||0,certs=trap?0:(+$('k-certs').value||0),cat=$('k-cat')&&$('k-cat').value||null;
 const eu=$('k-exp-u')&&$('k-exp-u').value,en=+$('k-exp-n').value;let expires=null;if(eu&&en>0)expires=new Date(Date.now()+en*({m:60000,h:3600000,d:86400000}[eu])).toISOString();
 const mini=!!($('k-mini')&&$('k-mini').checked&&!trap);
 if(cloudUid){const {data,error}=await sb.rpc('admin_create_redeem_code',{p_code:c,p_coins:coins,p_keys:keys,p_certs:certs,p_is_trap:trap,p_category:cat,p_expires_at:expires,p_mini:mini,p_max_redemptions:Math.max(1,Math.min(5555,parseInt($('k-max').value,10)||5555)),p_reward_type:$('k-reward-type').value,p_reward_value:$('k-reward-value').value||null,p_reward_qty:Math.max(1,Math.min(5555,parseInt($('k-reward-qty').value,10)||1))});if(error)return toast(error.message||'สร้างโค้ดไม่สำเร็จ');if(!data||data.success!==true)return toast((data&&data.message)||'สร้างโค้ดไม่สำเร็จ')}
 else{db.codes[c]={coins,keys,certs,max:Math.max(1,Math.min(5555,parseInt($('k-max').value,10)||5555)),rewardType:$('k-reward-type').value,rewardValue:$('k-reward-value').value,rewardQty:Math.max(1,Math.min(5555,parseInt($('k-reward-qty').value,10)||1)),redeemed:0};if(trap)db.codes[c].trap=1;if(mini)db.codes[c].mini=1;if(cat)db.codes[c].cat=cat;if(expires)db.codes[c].exp=Date.parse(expires)}
 if($('k-post').checked){if(cloudUid){const {error}=await sb.from('news').insert({title:trap?'เตือนภัยรหัสใหม่':'มีโค้ดใหม่!',content:trap?'มีรหัสกับดักชุดใหม่ ระวังให้ดี!':'มีโค้ดลับชุดใหม่ซ่อนอยู่ ลองหาดู!',published:true});if(error)toast('สร้างโค้ดสำเร็จ แต่ประกาศข่าวไม่สำเร็จ')}else db.news.push({id:Date.now(),type:trap?'warning':'code',title:trap?'เตือนภัยรหัสใหม่':'มีโค้ดใหม่!',body:trap?'มีรหัสกับดักชุดใหม่ ระวังให้ดี!':'มีโค้ดลับชุดใหม่ซ่อนอยู่ ลองหาดู!',comments:[]})}
 if(!cloudUid)sv();toast('สร้างโค้ด '+c+' สำเร็จ');render();setCT('list');
}
function saveSelf(){
 if(!isAdm())return;U().coins=Math.max(0,+$('g-coins').value||0);U().keys=Math.max(0,+$('g-keys').value||0);
 sv();toast('💾 บันทึกแล้ว');render();drawCreator();
}
function addSelf(c,k){if(!isAdm())return;U().coins+=c;U().keys+=k;sv();render();drawCreator()}
async function delCode(c){if(!isAdm())return;if(cloudUid){if(!confirm('ยืนยันลบโค้ด '+c+' ?'))return;const {data,error}=await sb.rpc('admin_delete_redeem_code',{p_code:c});if(error)return toast(error.message);if(!data||data.success!==true)return toast(data&&data.message||'ลบไม่สำเร็จ');toast('ลบโค้ด '+c+' แล้ว');return loadCreatorCodes()}delete db.codes[c];sv();toast('ลบโค้ด '+c+' แล้ว');drawCreator()}
async function delNews(id){
 if(!isAdm())return;
 if(cloudUid){const {error}=await sb.from('news').delete().eq('id',id);if(error)return toast('ลบข่าวไม่สำเร็จ: '+error.message)}
 db.news=db.news.filter(n=>n.id!==id);render();if(!creator.classList.contains('hidden'))drawCreator();
}
bootCloud().catch(e=>{console.error('Cloud startup failed',e);$('a-err').textContent='เชื่อมต่อระบบบัญชีไม่สำเร็จ กรุณาลองโหลดหน้าใหม่'}).finally(()=>initRoom().then(autoRoom));
</script>
</body>
</html>
